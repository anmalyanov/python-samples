name: time-tracker tests

on:
  push:
    paths:
      - "time_tracker/**"
      - ".github/workflows/time-tracker.yml"
  pull_request:
    paths:
      - "time_tracker/**"
      - ".github/workflows/time-tracker.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: time_tracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements.txt ruff
      - name: Lint
        run: ruff check timetracker tests && ruff format --check timetracker tests
      - name: Test
        run: pytest
