[project]
name = "timetracker"
version = "0.1.0"
description = "Учёт рабочего времени сотрудников: Flask + SQLite"
requires-python = ">=3.11"
dependencies = ["Flask>=3.0,<4"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
